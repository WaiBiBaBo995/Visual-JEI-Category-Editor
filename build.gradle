plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
}

group = 'com.pureneko.vjce'
version = mod_version
base { archivesName = "vjce-${minecraft_version}-fabric" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://www.cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
}

def uiTest = providers.gradleProperty('uiTest')
def clientDirectory = 'run/fabric-1.20.1'
loom {
    mods {
        vjce { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            runDir clientDirectory
            if (uiTest.isPresent()) {
                programArgs '--width', '1600', '--height', '900'
                property 'vjce.uitest', uiTest.get().trim() ?: 'all'
                property 'vjce.uitest.out', layout.buildDirectory.dir('ui-test').get().asFile.absolutePath
            }
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    modImplementation "curse.maven:ldlib-626676:${ldlib_file}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500']
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('jar') { manifest { attributes('Implementation-Version': project.version) } }
tasks.named('processResources') {
    def metadata = [version: project.version, minecraft: minecraft_version, loader: fabric_loader_version,
                    ldlib: ldlib_version, jei: jei_version]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand(metadata) }
    from(rootProject.file('LICENSE')) { into('META-INF') }
}
def productionMods = configurations.create('productionMods') {
    canBeConsumed = false
    transitive = false
}
dependencies {
    add(productionMods.name, "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    add(productionMods.name, "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}@jar")
    add(productionMods.name, "curse.maven:ldlib-626676:${ldlib_file}")
}

tasks.register('runPackagedClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('remapJar')
    mods.from(tasks.named('remapJar'), productionMods)
    runDir = file('run/fabric-1.20.1-packaged')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    if (uiTest.isPresent()) {
        programArgs.addAll('--width', '1600', '--height', '900')
        jvmArgs.add('-Dvjce.uitest=' + (uiTest.get().trim() ?: 'all'))
        jvmArgs.add('-Dvjce.uitest.out=' + layout.buildDirectory.dir('ui-test').get().asFile.absolutePath)
    }
}

if (uiTest.isPresent()) {
    tasks.matching { it.name in ['runClient', 'runPackagedClient'] }.configureEach {
        def report = layout.buildDirectory.file('ui-test/report.json')
        def exitCode = layout.buildDirectory.file('ui-test/exit-code.txt')
        doFirst {
            report.get().asFile.delete()
            exitCode.get().asFile.delete()
        }
        doLast {
            def file = report.get().asFile
            if (!file.isFile() || !new groovy.json.JsonSlurper().parse(file).passed) {
                throw new GradleException("VJCE client verification failed. Check ${file}.")
            }
        }
    }
}
